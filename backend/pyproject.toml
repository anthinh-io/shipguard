[project]
name = "shipguard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "pyjwt>=2.14.0",
    "pwdlib[argon2]>=0.3.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "xgboost>=2.1",
    "lightgbm>=4.4",
    "joblib>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"
